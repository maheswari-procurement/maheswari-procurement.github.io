<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maheswari Letchumanan | Strategic Sourcing & Category Management</title>
    <meta name="description" content="Maheswari Letchumanan: strategic sourcing and category management professional with 11+ years of indirect and CAPEX procurement in aviation and solar manufacturing." />
    <meta name="theme-color" content="#1f4d47" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Set theme before paint to avoid a flash
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
